<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header><h1>Expense Tracker</h1></header>
  <main>
    <p id="error" class="error" role="alert" hidden></p>

    <section>
      <h2>Categories</h2>
      <form id="category-form">
        <label>Name <input name="name" required></label>
        <button type="submit">Add category</button>
      </form>
      <ul id="category-list"></ul>
    </section>

    <section>
      <h2 id="expense-form-title">Add expense</h2>
      <form id="expense-form">
        <input type="hidden" name="expense_id">
        <label>Amount <input name="amount" type="number" step="0.01" min="0.01" required></label>
        <label>Description <input name="description" required></label>
        <label>Date <input name="date" type="date" required></label>
        <label>Category <select name="category_id" required></select></label>
        <label>Note <input name="note"></label>
        <button type="submit">Save</button>
        <button type="button" id="cancel-edit" hidden>Cancel</button>
      </form>
    </section>

    <section>
      <h2>Expenses</h2>
      <table>
        <thead>
          <tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Note</th><th></th></tr>
        </thead>
        <tbody id="expense-list"></tbody>
      </table>
    </section>

    <section>
      <h2>Monthly summary</h2>
      <form id="summary-form">
        <label>Month <input name="month" type="month" required></label>
        <button type="submit">Show</button>
      </form>
      <p id="summary-result"></p>
    </section>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
